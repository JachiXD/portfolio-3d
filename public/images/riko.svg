<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Riko in the browser: a cat-eared avatar beside a conversation and a talk button">
  <defs>
    <radialGradient id="glow" cx="18%" cy="4%" r="78%">
      <stop offset="0" stop-color="#d8342f" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#e0a15c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0a0607" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stage" cx="50%" cy="52%" r="52%">
      <stop offset="0" stop-color="#d8342f" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#7a2320" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0607" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#e0a15c" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#d8342f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d8342f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a191d"/>
      <stop offset="1" stop-color="#120a0c"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f8efe4" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0a0607"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <!-- the browser window -->
    <rect x="110" y="110" width="1380" height="780" rx="26" fill="#150d0f" stroke="#32211f"/>
    <line x1="110" y1="186" x2="1490" y2="186" stroke="#32211f"/>
    <circle cx="150" cy="148" r="7" fill="#d8342f"/>
    <circle cx="176" cy="148" r="7" fill="#4d3330"/>
    <circle cx="202" cy="148" r="7" fill="#4d3330"/>
    <text x="240" y="156" font-size="17" fill="#96786c" letter-spacing="3">JACHIXD.GITHUB.IO/RIKO-WEB</text>
    <text x="1460" y="156" font-size="17" fill="#e0a15c" text-anchor="end" letter-spacing="3">● LIVE</text>

    <!-- avatar stage -->
    <rect x="150" y="216" width="640" height="650" fill="#100a0c" stroke="#2a1a1d"/>
    <circle cx="470" cy="482" r="268" fill="url(#stage)"/>

    <g>
      <!-- hair mass behind the head -->
      <ellipse cx="470" cy="430" rx="132" ry="176" fill="#1e1116"/>
      <!-- cat ears -->
      <path d="M356 332L372 214L446 288Z" fill="#1e1116" stroke="#4a2b2c" stroke-width="2"/>
      <path d="M584 332L568 214L494 288Z" fill="#1e1116" stroke="#4a2b2c" stroke-width="2"/>
      <path d="M384 314L392 252L432 294Z" fill="#d8342f" opacity="0.45"/>
      <path d="M556 314L548 252L508 294Z" fill="#d8342f" opacity="0.45"/>
      <!-- face -->
      <ellipse cx="470" cy="418" rx="74" ry="90" fill="#2e1b21"/>
      <!-- fringe over the forehead -->
      <path d="M470 262c-58 0-96 40-100 96 16-30 40-48 70-54 18 26 54 34 88 20 16-8 28-20 34-34-12-20-50-28-92-28z" fill="#1a0f13"/>
      <!-- side locks -->
      <path d="M366 396c-14 52-10 100 4 148 10-46 16-96 20-140z" fill="#1a0f13"/>
      <path d="M574 396c14 52 10 100-4 148-10-46-16-96-20-140z" fill="#1a0f13"/>
      <!-- eyes, catching the light -->
      <ellipse cx="440" cy="420" rx="10" ry="14" fill="#e0a15c"/>
      <ellipse cx="500" cy="420" rx="10" ry="14" fill="#e0a15c"/>
      <!-- shoulders -->
      <path d="M470 502c-88 0-152 50-180 126-14 38-20 92-22 142h404c-2-50-8-104-22-142-28-76-92-126-180-126z" fill="url(#body)" stroke="#3a2327" stroke-width="2"/>
      <!-- collar -->
      <path d="M470 520l-52 38 52 42 52-42z" fill="#150d0f" stroke="#4a2b2c" stroke-width="2"/>
      <!-- rim light down one side -->
      <path d="M348 420c-10 34-12 74-4 108 8 32 18 62 26 88" fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round"/>
      <path d="M320 664c20-46 54-82 94-104" fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="180" y="834" font-size="15" fill="#96786c" letter-spacing="3">AVATAR · REAL-TIME</text>
    <text x="760" y="834" font-size="15" fill="#96786c" text-anchor="end" letter-spacing="3">● REC</text>

    <!-- conversation -->
    <rect x="820" y="216" width="630" height="650" fill="#120a0c" stroke="#2a1a1d"/>

    <text x="864" y="284" font-size="15" fill="#96786c" letter-spacing="4">YOU</text>
    <rect x="864" y="304" width="470" height="62" rx="12" fill="#1c1114" stroke="#33201f"/>
    <text x="888" y="344" font-size="23" fill="#c9a99c">hey riko, are you there?</text>

    <text x="864" y="428" font-size="15" fill="#e0a15c" letter-spacing="4">RIKO</text>
    <rect x="864" y="448" width="542" height="118" rx="12" fill="#20121a" stroke="#3d2530"/>
    <text x="888" y="486" font-size="23" fill="#f8efe4">Oh, senpai actually showed up.</text>
    <text x="888" y="522" font-size="23" fill="#f8efe4">I was starting to narrate</text>
    <text x="888" y="558" font-size="23" fill="#f8efe4">the wall.</text>

    <!-- the talk button -->
    <rect x="864" y="612" width="256" height="62" rx="31" fill="#d8342f"/>
    <circle cx="906" cy="643" r="9" fill="#0a0607" opacity="0.55"/>
    <rect x="901" y="636" width="10" height="14" rx="5" fill="#f8efe4"/>
    <text x="944" y="652" font-size="19" fill="#f8efe4" letter-spacing="2">TAP TO TALK</text>

    <rect x="1138" y="612" width="62" height="62" rx="14" fill="#1c1114" stroke="#33201f"/>
    <text x="1169" y="652" font-size="22" fill="#96786c" text-anchor="middle">⌨</text>

    <text x="864" y="726" font-size="16" fill="#96786c" letter-spacing="2">MIC · SPEECH · NEURAL VOICE</text>

    <!-- her voice, as a waveform -->
    <g fill="#d8342f">
      <rect x="864" y="772" width="6" height="22" rx="3"/>
      <rect x="882" y="762" width="6" height="42" rx="3"/>
      <rect x="900" y="748" width="6" height="70" rx="3"/>
      <rect x="918" y="770" width="6" height="26" rx="3"/>
      <rect x="936" y="736" width="6" height="94" rx="3"/>
      <rect x="954" y="758" width="6" height="50" rx="3"/>
      <rect x="972" y="744" width="6" height="78" rx="3"/>
      <rect x="990" y="772" width="6" height="22" rx="3"/>
      <rect x="1008" y="752" width="6" height="62" rx="3"/>
      <rect x="1026" y="734" width="6" height="98" rx="3"/>
      <rect x="1044" y="764" width="6" height="38" rx="3"/>
      <rect x="1062" y="776" width="6" height="14" rx="3"/>
      <rect x="1080" y="756" width="6" height="54" rx="3"/>
      <rect x="1098" y="770" width="6" height="26" rx="3"/>
      <rect x="1116" y="746" width="6" height="74" rx="3"/>
      <rect x="1134" y="768" width="6" height="30" rx="3"/>
      <rect x="1152" y="778" width="6" height="10" rx="3"/>
      <rect x="1170" y="758" width="6" height="50" rx="3"/>
      <rect x="1188" y="772" width="6" height="22" rx="3"/>
      <rect x="1206" y="750" width="6" height="66" rx="3"/>
      <rect x="1224" y="774" width="6" height="18" rx="3"/>
      <rect x="1242" y="762" width="6" height="42" rx="3"/>
      <rect x="1260" y="778" width="6" height="10" rx="3"/>
    </g>

    <text x="1404" y="846" font-size="16" fill="#96786c" text-anchor="end" letter-spacing="3">THREE.JS · THREE-VRM · KOKORO-82M</text>
  </g>
</svg>
