  </defs>
  <rect width="900" height="1200" fill="#0a0910"/>
  <rect width="900" height="1200" fill="url(#dots)"/>
  <ellipse cx="450" cy="560" rx="470" ry="330" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#f0eee4" stroke-opacity="0.11">
    <circle cx="450" cy="560" r="352"/>
    <ellipse cx="450" cy="560" rx="392" ry="150" transform="rotate(-19 450 560)"/>
    <ellipse cx="450" cy="560" rx="330" ry="126" transform="rotate(54 450 560)"/>
  </g>
  <circle cx="450" cy="560" r="170" fill="url(#orb)"/>
  <circle cx="450" cy="560" r="170" fill="none" stroke="#ffb08c" stroke-opacity="0.35"/>
  <circle cx="716" cy="700" r="5" fill="#ff6a00"/>
  <circle cx="198" cy="860" r="3" fill="#8b5cff"/>
  <path d="M60 946 L840 726" stroke="url(#line)" stroke-width="1.5"/>
