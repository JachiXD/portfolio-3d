<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Abstract render: a warm lit sphere inside orbital rings">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#d8342f" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#e0a15c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0607" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#fff7ec"/>
      <stop offset="24%" stop-color="#f0c78a"/>
      <stop offset="56%" stop-color="#3a1b1c"/>
      <stop offset="82%" stop-color="#1e1416"/>
      <stop offset="100%" stop-color="#150d0f"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f8efe4" opacity="0.09"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
