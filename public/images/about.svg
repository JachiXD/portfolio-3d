      <stop offset="0" stop-color="#d8342f" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e0a15c" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="#0a0607"/>
  <rect width="900" height="1200" fill="url(#dots)"/>
  <ellipse cx="450" cy="560" rx="470" ry="330" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#f8efe4" stroke-opacity="0.11">
    <circle cx="450" cy="560" r="352"/>
    <ellipse cx="450" cy="560" rx="392" ry="150" transform="rotate(-19 450 560)"/>
    <ellipse cx="450" cy="560" rx="330" ry="126" transform="rotate(54 450 560)" opacity="0.9"/>
  </g>
  <circle cx="450" cy="560" r="170" fill="url(#orb)"/>
  <circle cx="450" cy="560" r="170" fill="none" stroke="#f6d9a7" stroke-opacity="0.35"/>
  <circle cx="716" cy="700" r="5" fill="#d8342f"/>
  <circle cx="198" cy="860" r="3" fill="#e0a15c"/>
  <path d="M60 946 L840 726" stroke="url(#line)" stroke-width="1.5"/>
  <path d="M92 1010 L506 1000" stroke="#f8efe4" stroke-opacity="0.12"/>
  <text x="60" y="1112" fill="#f8efe4" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" letter-spacing="7">JAY TAKLE — AI &amp; ML</text>
